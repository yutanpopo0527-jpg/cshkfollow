<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教会学校 出席簿アプリ</title>
    
    <!-- ファビコン設定 -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (JSX compilation) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        @media print {
            @page {
                size: B4 landscape; /* B4 横向き */
                margin: 5mm; /* 余白を詰める */
            }
            body { 
                font-size: 9pt; 
                background: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                width: 100%;
            }
            .no-print { display: none !important; }
            .print-border { border: 1px solid #000; }
            .overflow-x-auto { overflow-x: visible; }
            
            /* 印刷時はスクロール領域を全展開 */
            .absolute.inset-0 { position: static; height: auto; }
            main { overflow: visible; }
            
            /* 印刷時に全体を縮小して3月まで収める */
            .print-scale-wrapper {
                transform: scale(0.85); /* 85%に縮小 */
                transform-origin: top left;
                width: 117%; /* 縮小した分、幅を広げて右端まで使う */
            }
            
            /* 印刷時はドロップダウンの中身などを隠す */
            .dropdown-content { display: none; }
            
            /* テーブルの見た目調整 */
            th, td { padding: 2px !important; }
            
            /* 印刷時は固定解除 */
            .sticky { position: static !important; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.2s ease-out forwards;
        }
        
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(-5%); }
            50% { transform: translateY(5%); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 2s infinite;
        }
    </style>
</head>
<body class="bg-amber-50 text-slate-800 font-sans flex flex-col min-h-screen text-xs md:text-sm">
    <div id="root" class="flex-grow flex flex-col h-screen"></div>

    <!-- type="text/babel" に data-type="module" を追加してFirebase v10をインポート可能にする -->
    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, increment, writeBatch, deleteField } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const { useState, useEffect, useMemo, useRef } = React;

        // ==========================================
        // Firebaseの初期設定
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBxriSl6JvV5CfJGEfDUTNXBs9RQJmI28U",
 　         authDomain: "hkpointapp.firebaseapp.com",
            projectId: "hkpointapp",
            storageBucket: "hkpointapp.firebasestorage.app",
            messagingSenderId: "696908221772",
            appId: "1:696908221772:web:0ad30910bd6c7493bbd3e9"
        };

        const isConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";
        let db;
        if (isConfigured) {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        }

        // --- アイコン定義 ---
        const ICONS = {
            Church: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 9h4"/><path d="M12 7v5"/><path d="M4 22h16a2 2 0 0 0 2-2V10L12 2 2 10v10a2 2 0 0 0 2 2z"/></svg>),
            UserPlus: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" x2="20" y1="8" y2="14"/><line x1="23" x2="17" y1="11" y2="11"/></svg>),
            Download: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>),
            Printer: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>),
            Users: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>),
            CircleCheck: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>),
            X: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 18 12"/></svg>),
            Clock: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>),
            Trash2: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>),
            Calendar: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>),
            MinusCircle: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>),
            Star: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>),
            Gift: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect width="20" height="5" x="2" y="7"/><line x1="12" x2="12" y1="22" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>),
            ChevronDown: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>),
            ArrowUp: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 15-6-6-6 6"/></svg>),
            ArrowDown: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>),
            Edit: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>),
            ListFilter: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>),
            Database: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>),
            Save: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>),
            Upload: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>),
            EyeOff: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>)
        };

        const Icon = ({ name, size = 18, className }) => {
            const IconComponent = ICONS[name];
            return IconComponent ? <IconComponent width={size} height={size} className={className} /> : null;
        };

        // --- 学年複数選択コンポーネント ---
        const GradeSelector = ({ selectedGrades, onChange }) => {
            const [isOpen, setIsOpen] = useState(false);
            const dropdownRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                        setIsOpen(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const grades = [
                { val: "1", label: "小1" },
                { val: "2", label: "小2" },
                { val: "3", label: "小3" },
                { val: "4", label: "小4" },
                { val: "5", label: "小5" },
                { val: "6", label: "小6" },
            ];

            const toggleGrade = (val) => {
                let newGrades;
                if (selectedGrades.includes(val)) {
                    newGrades = selectedGrades.filter(g => g !== val);
                } else {
                    newGrades = [...selectedGrades, val].sort();
                }
                onChange(newGrades);
            };

            const displayText = selectedGrades.length > 0 
                ? selectedGrades.map(g => `小${g}`).join(", ") 
                : "選択";

            return (
                <div className="relative" ref={dropdownRef}>
                    <button 
                        className="border border-gray-300 rounded px-2 py-1 bg-white flex items-center gap-2 min-w-[80px] justify-between text-xs md:text-sm"
                        onClick={() => setIsOpen(!isOpen)}
                    >
                        <span className="truncate max-w-[100px] md:max-w-[120px]">{displayText}</span>
                        <Icon name="ChevronDown" size={14} className="text-gray-500" />
                    </button>
                    
                    {isOpen && (
                        <div className="absolute top-full left-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg z-50 w-40 p-2 dropdown-content">
                            <div className="flex flex-col gap-1">
                                {grades.map((grade) => (
                                    <label key={grade.val} className="flex items-center gap-2 p-1.5 hover:bg-amber-50 rounded cursor-pointer">
                                        <input 
                                            type="checkbox" 
                                            checked={selectedGrades.includes(grade.val)}
                                            onChange={() => toggleGrade(grade.val)}
                                            className="accent-amber-500"
                                        />
                                        <span className="text-sm text-gray-700">{grade.label}</span>
                                    </label>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- メインアプリ ---
        const App = () => {
            const today = new Date();
            const currentMonth = today.getMonth() + 1;
            const initialSemester = (currentMonth >= 4 && currentMonth <= 9) ? "first" : "second";
            const initialFiscalYear = (currentMonth >= 1 && currentMonth <= 3) ? today.getFullYear() - 1 : today.getFullYear();

            // --- State (Firebase同期用) ---
            const [classInfo, setClassInfo] = useState({
                fiscalYear: initialFiscalYear,
                semester: initialSemester,
                grade: [],
                gender: "",
                teacher: ""
            });

            const [students, setStudents] = useState([]);
            const [attendance, setAttendance] = useState({});
            const [bonusMonths, setBonusMonths] = useState({});

            // 表示設定State
            const [viewConfig, setViewConfig] = useState({
                sort: 'manual', // manual, grade, points_desc, birthday
                filterGrades: [], // empty = all
                filterBirthMonth: 'all', // all, 1, 2...
                showHidden: false // 非表示の生徒を表示するかどうか
            });

            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [isDeleteModalOpen, setIsDeleteModalOpen] = useState(false);
            const [isPrintModalOpen, setIsPrintModalOpen] = useState(false);
            const [isViewConfigModalOpen, setIsViewConfigModalOpen] = useState(false); // 表示設定モーダル
            const [isDataModalOpen, setIsDataModalOpen] = useState(false); // データ管理モーダル
            const [studentToDelete, setStudentToDelete] = useState(null);
            
            // 編集用ステート
            const [editingStudent, setEditingStudent] = useState(null);

            const [newStudentName, setNewStudentName] = useState("");
            const [newStudentGrade, setNewStudentGrade] = useState("");
            const [newStudentBirthday, setNewStudentBirthday] = useState("");
            const [newStudentInitialPoints, setNewStudentInitialPoints] = useState(0);
            const [newStudentIsHidden, setNewStudentIsHidden] = useState(false); // 非表示設定用

            // ==========================================
            // Firebase リアルタイム同期
            // ==========================================
            useEffect(() => {
                if (!isConfigured) return;

                // 初回アクセス時に設定ドキュメントがなければ作成
                const initSettings = async () => {
                    const refs = ['classInfo', 'attendance', 'bonusMonths'];
                    for (const name of refs) {
                        const docRef = doc(db, 'cs_settings', name);
                        const snap = await getDoc(docRef);
                        if (!snap.exists()) {
                            await setDoc(docRef, {});
                        }
                    }
                };
                initSettings();

                // データの購読
                const unsubClass = onSnapshot(doc(db, 'cs_settings', 'classInfo'), doc => {
                    if (doc.exists() && Object.keys(doc.data()).length > 0) {
                        const data = doc.data();
                        if (typeof data.grade === 'string') data.grade = data.grade ? [data.grade] : [];
                        setClassInfo(data);
                    }
                });
                const unsubAttendance = onSnapshot(doc(db, 'cs_settings', 'attendance'), doc => {
                    if (doc.exists()) setAttendance(doc.data());
                    else setAttendance({});
                });
                const unsubBonus = onSnapshot(doc(db, 'cs_settings', 'bonusMonths'), doc => {
                    if (doc.exists()) setBonusMonths(doc.data());
                    else setBonusMonths({});
                });
                const unsubStudents = onSnapshot(collection(db, 'students'), snapshot => {
                    const list = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
                    // 登録時の順序(sortIndex)で並び替え
                    list.sort((a, b) => (a.sortIndex || 0) - (b.sortIndex || 0));
                    setStudents(list);
                });

                return () => { unsubClass(); unsubAttendance(); unsubBonus(); unsubStudents(); };
            }, []);

            // --- Logic ---
            const sundays = useMemo(() => {
                const dates = [];
                const year = parseInt(classInfo.fiscalYear);
                let startMonth, startYear;
                
                if (classInfo.semester === "first") {
                    startMonth = 3; 
                    startYear = year;
                } else {
                    startMonth = 9; 
                    startYear = year;
                }

                let current = new Date(startYear, startMonth, 1, 12, 0, 0);
                
                while (current.getDay() !== 0) {
                    current.setDate(current.getDate() + 1);
                }

                const endDate = classInfo.semester === "first" 
                    ? new Date(year, 8, 30, 12, 0, 0)
                    : new Date(year + 1, 2, 31, 12, 0, 0);

                while (current <= endDate) {
                    dates.push(new Date(current));
                    current.setDate(current.getDate() + 7);
                }
                return dates;
            }, [classInfo.fiscalYear, classInfo.semester]);

            const sundaysByMonth = useMemo(() => {
                const groups = [];
                let currentGroup = null;

                sundays.forEach(date => {
                    const monthKey = `${date.getFullYear()}-${date.getMonth() + 1}`;
                    
                    if (!currentGroup || currentGroup.key !== monthKey) {
                        if (currentGroup) groups.push(currentGroup);
                        currentGroup = {
                            key: monthKey,
                            year: date.getFullYear(),
                            month: date.getMonth() + 1,
                            dates: []
                        };
                    }
                    currentGroup.dates.push(date);
                });
                if (currentGroup) groups.push(currentGroup);
                return groups;
            }, [sundays]);

            const formatDateKey = (date) => date.toISOString().split('T')[0];

            // --- Stats Calculation (Used for View/Sorting) ---
            const calculateStats = (student) => {
                let presentCount = 0;
                let absentCount = 0;
                let totalPoints = student.initialPoints || 0;

                sundays.forEach(date => {
                    const key = `${student.id}_${formatDateKey(date)}`;
                    const status = attendance[key];
                    const monthKey = `${date.getFullYear()}-${date.getMonth() + 1}`;
                    const isBonus = bonusMonths[monthKey];
                    // 出席で+10P、3倍月間は+30P
                    const pointsPerAttend = isBonus ? 30 : 10;

                    if (status === 'present') {
                        presentCount++;
                        totalPoints += pointsPerAttend;
                    }
                    if (status === 'absent') absentCount++;
                });

                // QRレジと連動したFirebaseの残高(HKP)を優先して取得
                let hkp = student.pointBalance !== undefined ? student.pointBalance : totalPoints;

                return { presentCount, absentCount, totalPoints, hkp };
            };

            // --- Processed Students (Filter & Sort) ---
            const processedStudents = useMemo(() => {
                // 1. Calculate Stats for sorting
                let list = students.map(s => ({
                    ...s,
                    stats: calculateStats(s)
                }));

                // 2. Filter (Hidden)
                if (!viewConfig.showHidden) {
                    list = list.filter(s => !s.isHidden);
                }

                // 3. Filter (Grade)
                if (viewConfig.filterGrades.length > 0) {
                    list = list.filter(s => viewConfig.filterGrades.includes(s.grade));
                }
                // 4. Filter (Birth Month)
                if (viewConfig.filterBirthMonth !== 'all') {
                    const targetMonth = parseInt(viewConfig.filterBirthMonth);
                    list = list.filter(s => {
                        if (!s.birthday) return false;
                        const d = new Date(s.birthday);
                        return (d.getMonth() + 1) === targetMonth;
                    });
                }

                // 5. Sort
                if (viewConfig.sort === 'grade') {
                    list.sort((a, b) => (a.grade || "9").localeCompare(b.grade || "9"));
                } else if (viewConfig.sort === 'points_desc') {
                    list.sort((a, b) => b.stats.hkp - a.stats.hkp);
                } else if (viewConfig.sort === 'birthday') {
                    list.sort((a, b) => {
                        if (!a.birthday) return 1;
                        if (!b.birthday) return -1;
                        // Sort by Month-Day (ignore year)
                        const dA = new Date(a.birthday);
                        const dB = new Date(b.birthday);
                        const mdA = (dA.getMonth() + 1) * 100 + dA.getDate();
                        const mdB = (dB.getMonth() + 1) * 100 + dB.getDate();
                        return mdA - mdB;
                    });
                }
                // 'manual' uses original order (which is preserved since we mapped from students)

                return list;
            }, [students, attendance, bonusMonths, viewConfig, sundays]);


            // ==========================================
            // ハンドラ (Firebase更新用)
            // ==========================================

            const handleClassInfoChange = (key, value) => {
                const newInfo = { ...classInfo, [key]: value };
                setClassInfo(newInfo); // Optimistic UI
                if (isConfigured) {
                    setDoc(doc(db, 'cs_settings', 'classInfo'), newInfo, { merge: true }).catch(console.error);
                }
            };

            // 出席のトグルとポイント自動連動
            const toggleAttendance = async (studentId, dateKey) => {
                if (!isConfigured) return alert("Firebaseが設定されていません。");

                const key = `${studentId}_${dateKey}`;
                const currentStatus = attendance[key];
                let nextStatus;
                
                // 遅刻なし：出席 -> 欠席 -> CS休み -> 未定
                if (currentStatus === 'present') nextStatus = 'absent';
                else if (currentStatus === 'absent') nextStatus = 'holiday';
                else if (currentStatus === 'holiday') nextStatus = null;
                else nextStatus = 'present';

                // --- ポイント連動の計算 ---
                const d = new Date(dateKey);
                const monthKeyForBonus = `${d.getFullYear()}-${d.getMonth() + 1}`;
                const isBonus = bonusMonths[monthKeyForBonus];
                const pointsToAdd = isBonus ? 30 : 10;

                let pointDiff = 0;
                // 今回「出席」になったら加算
                if (currentStatus !== 'present' && nextStatus === 'present') pointDiff = pointsToAdd;
                // 「出席」を取り消したら減算
                else if (currentStatus === 'present' && nextStatus !== 'present') pointDiff = -pointsToAdd;

                try {
                    const batch = writeBatch(db);
                    
                    // 出欠記録の更新
                    if (nextStatus === null) {
                        batch.update(doc(db, 'cs_settings', 'attendance'), { [key]: deleteField() });
                    } else {
                        batch.update(doc(db, 'cs_settings', 'attendance'), { [key]: nextStatus });
                    }
                    
                    // 生徒のポイント残高を更新
                    if (pointDiff !== 0) {
                        batch.update(doc(db, 'students', String(studentId)), { pointBalance: increment(pointDiff) });
                    }
                    
                    await batch.commit();
                } catch (e) {
                    console.error("更新エラー", e);
                }
            };

            const toggleBonusMonth = async (monthKey) => {
                if (!isConfigured) return;
                const isCurrentlyBonus = !!bonusMonths[monthKey];
                try {
                    await updateDoc(doc(db, 'cs_settings', 'bonusMonths'), {
                        [monthKey]: isCurrentlyBonus ? deleteField() : true
                    });
                } catch(e) {
                    await setDoc(doc(db, 'cs_settings', 'bonusMonths'), {
                        [monthKey]: !isCurrentlyBonus
                    }, { merge: true });
                }
            };

            const updateStudentInitialPoints = async (id, points) => {
                if (!isConfigured) return;
                const val = parseInt(points) || 0;
                try {
                    await updateDoc(doc(db, 'students', String(id)), { initialPoints: val });
                } catch(e) { console.error(e); }
            };

            const updateStudentMemo = async (id, text) => {
                if (!isConfigured) return;
                try {
                    await updateDoc(doc(db, 'students', String(id)), { memo: text });
                } catch(e) { console.error(e); }
            };

            const handleSaveStudent = async (e) => {
                e.preventDefault();
                if (!isConfigured) return alert("Firebaseが設定されていません。");
                if (!newStudentName.trim()) return;

                try {
                    if (editingStudent) {
                        await updateDoc(doc(db, 'students', String(editingStudent.id)), {
                            name: newStudentName,
                            grade: newStudentGrade,
                            birthday: newStudentBirthday,
                            initialPoints: parseInt(newStudentInitialPoints) || 0,
                            isHidden: newStudentIsHidden
                        });
                    } else {
                        // 新規作成時：IDを自動採番して文字列にする (これがQRコード用のIDになります)
                        const currentIds = students.map(s => parseInt(s.id, 10)).filter(id => !isNaN(id));
                        const maxId = currentIds.length > 0 ? Math.max(...currentIds) : 0;
                        const newId = String(maxId + 1);
                        
                        await setDoc(doc(db, 'students', newId), {
                            name: newStudentName,
                            grade: newStudentGrade,
                            birthday: newStudentBirthday,
                            initialPoints: parseInt(newStudentInitialPoints) || 0,
                            pointBalance: parseInt(newStudentInitialPoints) || 0,
                            memo: "",
                            isHidden: newStudentIsHidden,
                            sortIndex: students.length
                        });
                    }
                    closeModal();
                } catch (e) {
                    console.error("保存エラー", e);
                    alert("保存に失敗しました。");
                }
            };

            const openAddModal = () => {
                setEditingStudent(null);
                setNewStudentName("");
                setNewStudentGrade("");
                setNewStudentBirthday("");
                setNewStudentInitialPoints(0);
                setNewStudentIsHidden(false);
                setIsAddModalOpen(true);
            };

            const openEditModal = (student) => {
                setEditingStudent(student);
                setNewStudentName(student.name);
                setNewStudentGrade(student.grade || "");
                setNewStudentBirthday(student.birthday || "");
                setNewStudentInitialPoints(student.initialPoints || 0);
                setNewStudentIsHidden(!!student.isHidden);
                setIsAddModalOpen(true);
            };

            const closeModal = () => {
                setIsAddModalOpen(false);
                setEditingStudent(null);
                setNewStudentName("");
                setNewStudentGrade("");
                setNewStudentBirthday("");
                setNewStudentInitialPoints(0);
                setNewStudentIsHidden(false);
            };

            const executeDeleteStudent = async () => {
                if (!isConfigured || !studentToDelete) return;
                try {
                    await deleteDoc(doc(db, 'students', String(studentToDelete.id)));
                    setIsDeleteModalOpen(false);
                    setStudentToDelete(null);
                } catch (e) { console.error(e); }
            };
            
            const moveStudent = async (index, direction) => {
                if (!isConfigured) return;
                const newStudents = [...students];
                if (direction === 'up' && index > 0) {
                    [newStudents[index], newStudents[index - 1]] = [newStudents[index - 1], newStudents[index]];
                } else if (direction === 'down' && index < newStudents.length - 1) {
                    [newStudents[index], newStudents[index + 1]] = [newStudents[index + 1], newStudents[index]];
                }
                
                // Firestoreのバッチ更新
                const batch = writeBatch(db);
                newStudents.forEach((s, i) => {
                    batch.update(doc(db, 'students', String(s.id)), { sortIndex: i });
                });
                await batch.commit();
            };

            // データ保存・復元 (Firestore対応版)
            const handleExportData = () => {
                const dataToSave = {
                    app: "cs-attendance",
                    version: "2.0",
                    date: new Date().toISOString(),
                    classInfo,
                    students,
                    attendance,
                    bonusMonths
                };
                const blob = new Blob([JSON.stringify(dataToSave, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = `cs_backup_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!confirm("現在のデータはすべて上書きされます。よろしいですか？")) {
                    e.target.value = null; // リセット
                    return;
                }

                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.app !== "cs-attendance") {
                            alert("このアプリのバックアップファイルではありません。");
                            return;
                        }
                        
                        // データの適用 (Firestoreへ)
                        const batch = writeBatch(db);
                        if(data.classInfo) batch.set(doc(db, 'cs_settings', 'classInfo'), data.classInfo);
                        if(data.attendance) batch.set(doc(db, 'cs_settings', 'attendance'), data.attendance);
                        if(data.bonusMonths) batch.set(doc(db, 'cs_settings', 'bonusMonths'), data.bonusMonths);
                        
                        if(data.students) {
                            data.students.forEach(s => {
                                batch.set(doc(db, 'students', String(s.id)), s);
                            });
                        }
                        await batch.commit();
                        
                        alert("データを復元しました！");
                        setIsDataModalOpen(false);
                    } catch (err) {
                        console.error(err);
                        alert("ファイルの読み込みに失敗しました。データが破損している可能性があります。");
                    }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const exportCSV = () => {
                let csvContent = "data:text/csv;charset=utf-8,";
                const dateHeaders = sundays.map(d => `${d.getMonth()+1}/${d.getDate()}`).join(",");
                csvContent += `名前,会員ID,学年,メモ,初期P,累計P,出席数,HKP,欠席数,${dateHeaders}\n`;

                students.forEach(s => {
                    const stats = calculateStats(s);
                    const row = [
                        s.name,
                        s.id,
                        s.grade ? `小${s.grade}` : "",
                        s.memo,
                        s.initialPoints,
                        stats.totalPoints,
                        stats.presentCount,
                        stats.hkp,
                        stats.absentCount,
                        ...sundays.map(d => {
                            const key = `${s.id}_${formatDateKey(d)}`;
                            const status = attendance[key];
                            return status === 'present' ? '出席' : (status === 'absent' ? '欠席' : (status === 'holiday' ? 'CS休み' : '-'));
                        })
                    ];
                    csvContent += row.join(",") + "\n";
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                const semesterName = classInfo.semester === 'first' ? '上半期' : '下半期';
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `出席簿_${classInfo.fiscalYear}_${semesterName}.csv`);
                document.body.appendChild(link);
                link.click();
            };

            const openPrintModal = () => {
                setIsPrintModalOpen(true);
            };

            const executePrint = (targetSemester) => {
                if (classInfo.semester !== targetSemester) {
                    handleClassInfoChange('semester', targetSemester);
                    setTimeout(() => {
                        window.print();
                    }, 500);
                } else {
                    window.print();
                }
                setIsPrintModalOpen(false);
            };

            // 次の出席機会におけるボーナスポイント取得
            const getNextBonusInfo = (studentId) => {
                const nextSunday = sundays.find(d => {
                    const key = `${studentId}_${formatDateKey(d)}`;
                    return !attendance[key];
                });
                const targetDate = nextSunday || sundays[sundays.length - 1];
                const monthKey = `${targetDate.getFullYear()}-${targetDate.getMonth() + 1}`;
                return bonusMonths[monthKey] ? 30 : 10;
            };

            const isGiftNear = (currentPoints, studentId) => {
                const nextPoints = getNextBonusInfo(studentId);
                if (currentPoints > 0 && currentPoints % 100 === 0) return false;
                const currentHundred = Math.floor(currentPoints / 100);
                const nextHundred = Math.floor((currentPoints + nextPoints) / 100);
                return nextHundred > currentHundred;
            };

            // スタイル
            const getCellColor = (status) => {
                switch(status) {
                    case 'present': return 'bg-green-100 text-green-700 hover:bg-green-200 border-green-300';
                    case 'absent': return 'bg-red-100 text-red-700 hover:bg-red-200 border-red-300';
                    case 'holiday': return 'bg-gray-200 text-gray-500 hover:bg-gray-300 border-gray-300';
                    default: return 'bg-white hover:bg-gray-50 border-gray-200';
                }
            };

            const getStatusIcon = (status) => {
                switch(status) {
                    case 'present': return 'CircleCheck';
                    case 'absent': return 'X';
                    case 'holiday': return 'MinusCircle';
                    default: return '';
                }
            };

            const isBirthdayNear = (studentBirthdayStr, sundayDate) => {
                if (!studentBirthdayStr) return false;
                const birthDate = new Date(studentBirthdayStr);
                const sunday = new Date(sundayDate);
                const weekStart = new Date(sunday);
                const weekEnd = new Date(sunday);
                weekEnd.setDate(weekEnd.getDate() + 6);
                const checkYears = [sunday.getFullYear(), sunday.getFullYear() + 1];
                for (let y of checkYears) {
                    const bDayThisYear = new Date(y, birthDate.getMonth(), birthDate.getDate());
                    if (bDayThisYear >= weekStart && bDayThisYear <= weekEnd) return true;
                }
                return false;
            };

            return (
                <div className="flex flex-col h-full min-h-screen">
                    {/* Firebase未設定警告 */}
                    {!isConfigured && (
                        <div className="bg-red-100 text-red-700 px-4 py-2 text-center text-sm font-bold no-print shadow-sm">
                            Firebaseが設定されていません。コード内の firebaseConfig をご自身のものに書き換えてください。
                        </div>
                    )}

                    {/* ヘッダー */}
                    <header className="bg-white shadow-sm border-b border-amber-200 sticky top-0 z-[60] no-print">
                        <div className="max-w-full mx-auto px-4 py-2 md:py-3 flex flex-col md:flex-row items-center justify-between gap-3 border-b border-gray-100">
                            <div className="flex items-center gap-2">
                                <div className="p-1.5 md:p-2 bg-amber-100 rounded-lg text-amber-600">
                                    <Icon name="Church" size={20} className="md:w-6 md:h-6" />
                                </div>
                                <h1 className="text-lg md:text-xl font-bold text-gray-800">教会学校 出席フォロー表</h1>
                            </div>

                            <div className="flex flex-wrap items-center justify-center gap-2 bg-gray-50 p-1 md:p-1.5 rounded-lg border border-gray-200">
                                <div className="flex items-center">
                                    <input 
                                        type="number" 
                                        value={classInfo.fiscalYear}
                                        onChange={(e) => handleClassInfoChange('fiscalYear', e.target.value)}
                                        className="w-16 md:w-20 p-1 text-center bg-white border border-gray-300 rounded-l-md focus:ring-amber-500 focus:border-amber-500 text-xs md:text-sm"
                                    />
                                    <span className="bg-gray-100 border border-l-0 border-gray-300 rounded-r-md px-1.5 md:px-2 py-1 text-xs md:text-sm font-medium">年度</span>
                                </div>
                                <div className="flex bg-white rounded-md border border-gray-300 overflow-hidden">
                                    <button 
                                        onClick={() => handleClassInfoChange('semester', 'first')}
                                        className={`px-2 py-1 md:px-3 text-xs md:text-sm font-medium transition ${classInfo.semester === 'first' ? 'bg-amber-100 text-amber-700' : 'hover:bg-gray-50'}`}
                                    >
                                        上半期(4-9月)
                                    </button>
                                    <div className="w-px bg-gray-300"></div>
                                    <button 
                                        onClick={() => handleClassInfoChange('semester', 'second')}
                                        className={`px-2 py-1 md:px-3 text-xs md:text-sm font-medium transition ${classInfo.semester === 'second' ? 'bg-amber-100 text-amber-700' : 'hover:bg-gray-50'}`}
                                    >
                                        下半期(10-3月)
                                    </button>
                                </div>
                            </div>

                            <div className="flex gap-1.5 md:gap-2 no-print overflow-x-auto w-full md:w-auto pb-1 md:pb-0">
                                <button onClick={openAddModal} className="flex-shrink-0 flex items-center gap-1 md:gap-2 bg-amber-500 hover:bg-amber-600 text-white px-2 py-1.5 md:px-3 md:py-2 rounded-lg font-medium transition shadow-sm text-xs md:text-sm"><Icon name="UserPlus" size={14} /><span>生徒追加</span></button>
                                <button onClick={openPrintModal} className="flex-shrink-0 flex items-center gap-1 md:gap-2 bg-blue-500 hover:bg-blue-600 text-white px-2 py-1.5 md:px-3 md:py-2 rounded-lg font-medium transition shadow-sm text-xs md:text-sm"><Icon name="Printer" size={14} /><span>印刷</span></button>
                                <button onClick={exportCSV} className="flex-shrink-0 flex items-center gap-1 md:gap-2 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-2 py-1.5 md:px-3 md:py-2 rounded-lg font-medium transition shadow-sm text-xs md:text-sm" title="CSV出力"><Icon name="Download" size={14} /><span>出力</span></button>
                                <div className="flex-shrink-0 flex bg-white border border-gray-300 rounded-lg overflow-hidden">
                                    <button onClick={() => setIsViewConfigModalOpen(true)} className={`flex items-center gap-1 px-2 py-1.5 md:px-3 md:py-2 font-medium transition shadow-sm text-xs md:text-sm border-r border-gray-200 ${viewConfig.sort !== 'manual' || viewConfig.filterGrades.length > 0 || viewConfig.filterBirthMonth !== 'all' || viewConfig.showHidden ? 'bg-amber-100 text-amber-700' : 'bg-white text-gray-700 hover:bg-gray-50'}`} title="リスト表示設定"><Icon name="ListFilter" size={14} /></button>
                                    <button onClick={() => setIsDataModalOpen(true)} className="flex items-center gap-1 px-2 py-1.5 md:px-3 md:py-2 bg-white text-gray-700 hover:bg-gray-50 font-medium transition shadow-sm text-xs md:text-sm" title="データ管理"><Icon name="Database" size={14} /></button>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* メインテーブル */}
                    <main className="flex-grow overflow-hidden relative print-scale-wrapper">
                        <div className="absolute inset-0 overflow-auto">
                            <div className="min-w-max p-2 md:p-4">
                                <div className="bg-white rounded-xl shadow border border-gray-200 print-border">
                                    <table className="border-collapse text-left w-full">
                                        <thead>
                                            {/* ヘッダー1行目 */}
                                            <tr className="bg-gray-100 text-gray-700 text-xs md:text-sm border-b border-gray-200">
                                                <th colSpan="4" className="p-1 md:p-2 border-r sticky left-0 z-50 bg-gray-100 print:static"></th>
                                                {sundaysByMonth.map(group => (
                                                    <th key={group.key} colSpan={group.dates.length} className="p-1 md:p-2 border-r text-center border-gray-300 sticky top-0 z-50 bg-gray-100">
                                                        <div className="flex flex-col items-center justify-center gap-0.5 md:gap-1">
                                                            <span className="font-bold text-base md:text-lg">{group.month}月</span>
                                                            <label className={`no-print flex items-center gap-1 text-[10px] md:text-xs px-1.5 py-0.5 rounded cursor-pointer select-none transition ${bonusMonths[group.key] ? 'bg-yellow-100 text-yellow-700 font-bold ring-1 ring-yellow-400' : 'bg-gray-200 text-gray-500 hover:bg-gray-300'}`}>
                                                                <input type="checkbox" checked={!!bonusMonths[group.key]} onChange={() => toggleBonusMonth(group.key)} className="hidden" />
                                                                <span className="whitespace-nowrap">{bonusMonths[group.key] ? '★3倍月間' : '3倍月間'}</span>
                                                            </label>
                                                            {bonusMonths[group.key] && <span className="hidden print:inline text-xs font-bold border border-black px-1">3倍月間</span>}
                                                        </div>
                                                    </th>
                                                ))}
                                                <th colSpan="2" className="border-l sticky top-0 z-50 bg-gray-100"></th>
                                            </tr>

                                            {/* ヘッダー2行目 */}
                                            <tr className="bg-gray-50 text-gray-600 text-xs md:text-sm border-b border-gray-200">
                                                <th className="p-2 md:p-3 w-10 md:w-16 sticky left-0 z-50 text-center font-medium border-r print:static bg-gray-50">順</th>
                                                <th className="p-2 md:p-3 w-32 md:w-44 sticky left-10 md:left-16 z-50 font-medium shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] border-r print:static print:shadow-none bg-gray-50 text-center">名前 [会員ID]</th>
                                                <th className="p-2 md:p-3 w-12 md:w-16 text-center font-medium border-r text-[10px] md:text-xs sticky left-[10.5rem] md:left-[15.5rem] z-50 print:static bg-gray-50">出席数</th>
                                                <th className="p-2 md:p-3 w-14 md:w-20 text-center font-medium border-r text-[10px] md:text-xs sticky left-[13.5rem] md:left-[19.5rem] z-40 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] print:static print:shadow-none bg-gray-50">HKP</th>
                                                
                                                {sundaysByMonth.map(group => (
                                                    group.dates.map((date, i) => {
                                                        const isMonthStart = i === 0;
                                                        const borderClass = isMonthStart ? "border-l-2 border-l-gray-300" : "border-l border-gray-100";
                                                        const isBonus = bonusMonths[group.key];
                                                        return (
                                                            <th key={date.toISOString()} className={`p-1 min-w-[28px] md:min-w-[36px] text-center font-medium sticky top-8 z-40 bg-gray-50 ${borderClass} ${isBonus ? 'bg-yellow-50/50' : ''}`}>
                                                                <span className={`text-xs md:text-sm font-bold ${isBirthdayNear ? 'text-gray-700' : 'text-amber-600'}`}>{date.getDate()}</span>
                                                            </th>
                                                        );
                                                    })
                                                ))}
                                                <th className="p-2 md:p-3 min-w-[100px] md:min-w-[150px] font-medium text-gray-400 border-l sticky top-8 z-40 bg-gray-50">メモ</th>
                                                <th className="p-2 md:p-3 w-8 md:w-10 text-center no-print sticky top-8 z-40 bg-gray-50"></th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-100">
                                            {students.length === 0 ? (
                                                <tr><td colSpan={sundays.length + 6} className="p-12 text-center text-gray-400"><div className="flex flex-col items-center gap-2"><Icon name="Users" size={48} className="text-gray-300" /><p>生徒を登録してください。</p></div></td></tr>
                                            ) : (
                                                processedStudents.map((student, idx) => {
                                                    const stats = calculateStats(student);
                                                    // プレゼント判定は元の合計P(累計)を使用
                                                    const nearGift = isGiftNear(stats.totalPoints, student.id);
                                                    const originalIndex = students.findIndex(s => s.id === student.id);

                                                    return (
                                                        <tr key={student.id} className={`hover:bg-gray-50 transition group ${student.isHidden ? 'bg-gray-100' : ''}`}>
                                                            <td className={`p-1 text-center text-gray-400 sticky left-0 z-20 border-r print:static ${student.isHidden ? 'bg-gray-100' : 'bg-white group-hover:bg-gray-50'}`}>
                                                                <div className="flex flex-col items-center justify-center h-full gap-1 no-print">
                                                                    {(viewConfig.sort === 'manual' && viewConfig.filterGrades.length === 0 && viewConfig.filterBirthMonth === 'all') ? (
                                                                        <>
                                                                            <button onClick={() => moveStudent(originalIndex, 'up')} disabled={originalIndex === 0} className="hover:text-amber-500 disabled:opacity-30"><Icon name="ArrowUp" size={14} className="w-3 h-3 md:w-4 md:h-4" /></button>
                                                                            <span className="text-[10px] md:text-xs font-mono">{idx + 1}</span>
                                                                            <button onClick={() => moveStudent(originalIndex, 'down')} disabled={originalIndex === students.length - 1} className="hover:text-amber-500 disabled:opacity-30"><Icon name="ArrowDown" size={14} className="w-3 h-3 md:w-4 md:h-4" /></button>
                                                                        </>
                                                                    ) : (
                                                                        <span className="text-xs font-mono text-gray-300">{idx + 1}</span>
                                                                    )}
                                                                </div>
                                                                <span className="hidden print:block">{idx + 1}</span>
                                                            </td>
                                                            <td className={`p-2 md:p-3 sticky left-10 md:left-16 z-20 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] border-r print:static print:shadow-none ${student.isHidden ? 'bg-gray-100' : 'bg-white group-hover:bg-gray-50'}`}>
                                                                <div className="flex flex-col gap-1">
                                                                    <div className="font-bold text-gray-800 flex items-center gap-1 cursor-pointer hover:text-amber-600 transition text-xs md:text-sm" onClick={() => openEditModal(student)}>
                                                                        <span className="truncate max-w-[80px] md:max-w-none">{student.name}</span>
                                                                        <span className="text-[9px] md:text-[10px] font-mono text-slate-400 bg-slate-50 px-1 rounded">[{student.id}]</span>
                                                                        {student.isHidden && <Icon name="EyeOff" size={12} className="text-gray-400" />}
                                                                        {student.grade && <span className="text-[10px] md:text-xs text-slate-500 bg-slate-100 px-1 py-0.5 rounded border border-slate-200">小{student.grade}</span>}
                                                                    </div>
                                                                    <div className="flex items-center gap-1 md:gap-2 no-print">
                                                                        {student.birthday && <div className="text-[9px] md:text-[10px] text-gray-400 flex items-center gap-0.5"><Icon name="Calendar" size={10} />{student.birthday.substring(5).replace('-', '/')}</div>}
                                                                        <div className="flex items-center gap-1 text-[9px] md:text-[10px] text-gray-500 bg-gray-100 px-1 rounded ml-auto">
                                                                            <span>初期:</span><input type="number" defaultValue={student.initialPoints} onBlur={(e) => updateStudentInitialPoints(student.id, e.target.value)} className="w-6 md:w-8 bg-transparent text-right border-b border-gray-300 focus:border-amber-400 outline-none" />
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </td>
                                                            <td className={`p-1 md:p-2 text-center border-r font-medium text-gray-700 text-xs md:text-sm sticky left-[10.5rem] md:left-[15.5rem] z-20 print:static ${student.isHidden ? 'bg-gray-100' : 'bg-white'}`}>
                                                                {stats.presentCount}
                                                            </td>
                                                            <td className={`p-1 md:p-2 text-center border-r transition-colors relative sticky left-[13.5rem] md:left-[19.5rem] z-30 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] print:static print:shadow-none ${student.isHidden ? 'bg-gray-100' : 'bg-amber-50 group-hover:bg-amber-100'}`}>
                                                                <div className="flex flex-col items-center justify-center h-full gap-0.5">
                                                                    <div className="font-bold text-sm md:text-lg text-amber-700">{stats.hkp}</div>
                                                                    {nearGift && !student.isHidden && (
                                                                        <div className="bg-red-500 text-white text-[8px] md:text-[9px] px-1.5 py-0.5 rounded-full shadow-sm border border-white flex items-center gap-0.5 whitespace-nowrap no-print z-[100]">
                                                                            <Icon name="Gift" size={8} /><span>次GET!</span>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </td>

                                                            {sundaysByMonth.map(group => (
                                                                group.dates.map((date, i) => {
                                                                    const dateKey = formatDateKey(date);
                                                                    const key = `${student.id}_${dateKey}`;
                                                                    const status = attendance[key];
                                                                    const isBirthWeek = isBirthdayNear(student.birthday, date);
                                                                    const borderClass = i === 0 ? "border-l-2 border-l-gray-300" : "border-l border-gray-100";
                                                                    return (
                                                                        <td key={dateKey} className={`p-1 relative ${borderClass} ${bonusMonths[group.key] && !student.isHidden ? 'bg-yellow-50/30' : ''}`}>
                                                                            {isBirthWeek && !student.isHidden && <div className="absolute -top-1 -right-1 z-10 animate-bounce no-print"><span className="text-base md:text-lg drop-shadow-sm filter">🎂</span></div>}
                                                                            <button onClick={() => toggleAttendance(student.id, dateKey)} disabled={student.isHidden} className={`w-full h-8 md:h-10 min-w-[28px] md:min-w-[36px] rounded-md flex items-center justify-center transition-all duration-200 border ${getCellColor(status)} print:border-black print:h-8 ${student.isHidden ? 'opacity-50 cursor-not-allowed' : ''}`}>
                                                                                {status && <Icon name={getStatusIcon(status)} size={14} className="md:w-4 md:h-4" />}
                                                                            </button>
                                                                        </td>
                                                                    );
                                                                })
                                                            ))}
                                                            
                                                            <td className="p-1 md:p-2 border-l">
                                                                <input type="text" defaultValue={student.memo} onBlur={(e) => { if(e.target.value !== student.memo) updateStudentMemo(student.id, e.target.value); }} placeholder="..." disabled={student.isHidden} className="w-full bg-transparent border-b border-transparent focus:border-amber-400 focus:outline-none text-[10px] md:text-xs py-1 print:border-none disabled:opacity-50" />
                                                            </td>
                                                            <td className="p-1 md:p-2 text-center no-print">
                                                                <button onClick={() => { setStudentToDelete(student); setIsDeleteModalOpen(true); }} className="text-gray-300 hover:text-red-500 transition p-1 md:p-2"><Icon name="Trash2" size={14} className="md:w-4 md:h-4" /></button>
                                                            </td>
                                                        </tr>
                                                    );
                                                })
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </main>
                    
                    {/* フッター */}
                    <footer className="bg-white border-t border-gray-200 p-2 md:p-4 z-20 no-print">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-2 md:gap-4">
                            <div className="flex flex-wrap gap-2 md:gap-4 text-[10px] md:text-xs text-gray-600 justify-center">
                                <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 md:w-3 md:h-3 rounded bg-green-100 border border-green-300"></span> 出席 (+10P)</div>
                                <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 md:w-3 md:h-3 rounded bg-red-100 border border-red-300"></span> 欠席</div>
                                <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 md:w-3 md:h-3 rounded bg-gray-200 border border-gray-300"></span> CS休み</div>
                                <div className="flex items-center gap-1"><span className="font-bold text-amber-600 bg-yellow-100 px-1 rounded">★3倍</span> 月間は+30P</div>
                            </div>
                            <div className="text-gray-400 text-xs font-medium">東広島めぐみ教会 CS出席管理</div>
                        </div>
                    </footer>

                    {/* モーダル類 */}
                    {isPrintModalOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 animate-fadeIn no-print">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm text-center">
                                <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center justify-center gap-2"><Icon name="Printer" /> 印刷する期間を選択</h3>
                                <div className="flex flex-col gap-3">
                                    <button onClick={() => executePrint('first')} className="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-medium shadow-sm transition flex items-center justify-center gap-2">上半期 (4月〜9月) を印刷</button>
                                    <button onClick={() => executePrint('second')} className="w-full py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-medium shadow-sm transition flex items-center justify-center gap-2">下半期 (10月〜3月) を印刷</button>
                                </div>
                                <button onClick={() => setIsPrintModalOpen(false)} className="mt-6 text-gray-500 hover:text-gray-700 text-sm underline">キャンセル</button>
                            </div>
                        </div>
                    )}

                    {isAddModalOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 animate-fadeIn no-print">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md">
                                <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><Icon name="UserPlus" className="text-amber-500" />{editingStudent ? "生徒情報を編集" : "生徒を登録"}</h2>
                                <form onSubmit={handleSaveStudent}>
                                    <div className="flex gap-4 mb-4">
                                        <div className="flex-[2]"><label className="block text-sm font-medium text-gray-700 mb-1">お名前 <span className="text-red-500">*</span></label><input type="text" value={newStudentName} onChange={(e) => setNewStudentName(e.target.value)} className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none" placeholder="例: 山田 太郎" autoFocus /></div>
                                        <div className="flex-1"><label className="block text-sm font-medium text-gray-700 mb-1">学年</label><select value={newStudentGrade} onChange={(e) => setNewStudentGrade(e.target.value)} className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none bg-white"><option value="">選択</option><option value="1">小1</option><option value="2">小2</option><option value="3">小3</option><option value="4">小4</option><option value="5">小5</option><option value="6">小6</option></select></div>
                                    </div>
                                    <div className="flex gap-4 mb-6">
                                        <div className="flex-1"><label className="block text-sm font-medium text-gray-700 mb-1">誕生日 (任意)</label><input type="date" value={newStudentBirthday} onChange={(e) => setNewStudentBirthday(e.target.value)} className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none" /></div>
                                        <div className="w-24"><label className="block text-sm font-medium text-gray-700 mb-1">初期P</label><input type="number" value={newStudentInitialPoints} onChange={(e) => setNewStudentInitialPoints(e.target.value)} className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none text-right" /></div>
                                    </div>
                                    {editingStudent && (<div className="mb-6 p-3 bg-gray-50 rounded-lg border border-gray-200"><label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={newStudentIsHidden} onChange={(e) => setNewStudentIsHidden(e.target.checked)} className="w-4 h-4 text-amber-500 rounded focus:ring-amber-500" /><span className="text-sm text-gray-700">この生徒をリストに表示しない (非表示)</span></label></div>)}
                                    <div className="flex justify-end gap-3"><button type="button" onClick={closeModal} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition text-sm">キャンセル</button><button type="submit" disabled={!newStudentName.trim()} className="px-4 py-2 bg-amber-500 hover:bg-amber-600 disabled:bg-gray-300 text-white rounded-lg font-medium transition shadow-sm text-sm">{editingStudent ? "更新する" : "登録する"}</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {isViewConfigModalOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 animate-fadeIn no-print">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm">
                                <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><Icon name="ListFilter" className="text-amber-500" />リスト表示設定</h3>
                                <div className="mb-6"><label className="block text-sm font-bold text-gray-700 mb-2">表示オプション</label><label className="flex items-center p-2 rounded hover:bg-gray-50 cursor-pointer border border-gray-200"><input type="checkbox" checked={viewConfig.showHidden} onChange={(e) => setViewConfig({...viewConfig, showHidden: e.target.checked})} className="mr-2 text-amber-500 focus:ring-amber-500"/><span className="text-sm">非表示設定の生徒も表示する</span></label></div>
                                <div className="mb-6"><label className="block text-sm font-bold text-gray-700 mb-2">並び替え (ソート)</label><div className="space-y-2">{[{ val: 'manual', label: '標準 (登録順)' }, { val: 'grade', label: '学年順' }, { val: 'points_desc', label: 'HKP順 (多い順)' }, { val: 'birthday', label: '誕生日順' }].map(opt => (<label key={opt.val} className="flex items-center p-2 rounded hover:bg-gray-50 cursor-pointer"><input type="radio" name="sort" value={opt.val} checked={viewConfig.sort === opt.val} onChange={(e) => setViewConfig({...viewConfig, sort: e.target.value})} className="mr-2 text-amber-500 focus:ring-amber-500"/><span className="text-sm">{opt.label}</span></label>))}</div></div>
                                <div className="flex justify-end"><button onClick={() => setIsViewConfigModalOpen(false)} className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-medium transition shadow-sm text-sm">閉じる</button></div>
                            </div>
                        </div>
                    )}

                    {isDataModalOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 animate-fadeIn no-print">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm text-center">
                                <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center justify-center gap-2"><Icon name="Database" className="text-amber-500" />データ管理</h3>
                                <div className="flex flex-col gap-4">
                                    <button onClick={handleExportData} className="w-full py-4 bg-white border border-gray-300 hover:bg-gray-50 rounded-lg shadow-sm transition flex flex-col items-center gap-2 group"><Icon name="Save" size={24} className="text-amber-500 group-hover:scale-110 transition-transform" /><span className="font-bold">ファイルに保存</span></button>
                                    <div className="relative w-full"><input type="file" accept=".json" onChange={handleImportData} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"/><div className="w-full py-4 bg-white border border-gray-300 hover:bg-gray-50 rounded-lg shadow-sm transition flex flex-col items-center gap-2 group"><Icon name="Upload" size={24} className="text-blue-500 group-hover:scale-110 transition-transform" /><span className="font-bold">ファイルから復元</span></div></div>
                                </div>
                                <button onClick={() => setIsDataModalOpen(false)} className="mt-6 text-gray-500 hover:text-gray-700 text-sm underline">閉じる</button>
                            </div>
                        </div>
                    )}

                    {isDeleteModalOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 animate-fadeIn no-print">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm text-center">
                                <div className="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="Trash2" size={24} /></div>
                                <h3 className="text-lg font-bold text-gray-800 mb-2">削除しますか？</h3>
                                <p className="text-sm text-gray-600 mb-6">「{studentToDelete?.name}」さんのデータを削除します。<br/>この操作は元に戻せません。</p>
                                <div className="flex justify-center gap-3"><button onClick={() => setIsDeleteModalOpen(false)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition text-sm font-medium">キャンセル</button><button onClick={executeDeleteStudent} className="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg font-medium transition shadow-sm text-sm">削除実行</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
