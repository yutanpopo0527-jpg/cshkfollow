<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教会学校 出席簿アプリ</title>
    
    <!-- ファビコン設定 -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (JSX compilation) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        @media print {
            @page {
                size: B4 landscape;
                margin: 5mm; 
            }
            body { 
                font-size: 9pt; 
                background: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                width: 100%;
            }
            .no-print { display: none !important; }
            .print-border { border: 1px solid #000; }
            .overflow-x-auto { overflow-x: visible; }
            .absolute.inset-0 { position: static; height: auto; }
            main { overflow: visible; }
            .print-scale-wrapper {
                transform: scale(0.85); 
                transform-origin: top left;
                width: 117%; 
            }
            .dropdown-content { display: none; }
            th, td { padding: 2px !important; }
            .sticky { position: static !important; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.2s ease-out forwards;
        }
        
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(-5%); }
            50% { transform: translateY(5%); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 2s infinite;
        }
    </style>
</head>
<body class="bg-amber-50 text-slate-800 font-sans flex flex-col min-h-screen text-xs md:text-sm">
    <div id="root" class="flex-grow flex flex-col h-screen"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, increment, writeBatch, deleteField } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const { useState, useEffect, useMemo, useRef } = React;

        // ==========================================
        // Firebaseの初期設定
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyBxriSl6JvV5CfJGEfDUTNXBs9RQJmI28U",
          authDomain: "hkpointapp.firebaseapp.com",
          projectId: "hkpointapp",
          storageBucket: "hkpointapp.firebasestorage.app",
          messagingSenderId: "696908221772",
          appId: "1:696908221772:web:0ad30910bd6c7493bbd3e9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const isConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";

        // ==========================================
        // Google Apps Script (GAS) 連携設定
        // ==========================================
        // ※ GAS側でWebアプリをデプロイした後、発行されたURLをここに貼り付けてください
        const GAS_WEB_APP_URL = ""; // 例: "https://script.google.com/macros/s/xxxxx/exec"

        // --- GASへ出席データを送信するヘルパー関数 ---
        const sendToGoogleSheet = (student, dateKey, status) => {
            if (!GAS_WEB_APP_URL) return; // URLが未設定なら何もしない
            const payload = {
                date: dateKey,
                studentId: student.id,
                studentName: student.name,
                grade: student.grade || "",
                status: status,
                timestamp: new Date().toISOString()
            };
            try {
                fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.error("スプレッドシート連携エラー:", error);
            }
        };

        // --- ヘルパー関数: 誕生日判定 ---
        const isBirthdayNear = (studentBirthdayStr, sundayDate) => {
            if (!studentBirthdayStr) return false;
            const birthDate = new Date(studentBirthdayStr);
            const sunday = new Date(sundayDate);
            const weekStart = new Date(sunday);
            const weekEnd = new Date(sunday);
            weekEnd.setDate(weekEnd.getDate() + 6);
            const checkYears = [sunday.getFullYear(), sunday.getFullYear() + 1];
            for (let y of checkYears) {
                const bDayThisYear = new Date(y, birthDate.getMonth(), birthDate.getDate());
                if (bDayThisYear >= weekStart && bDayThisYear <= weekEnd) return true;
            }
            return false;
        };

        // --- アイコン定義 ---
        const ICONS = {
            Church: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 9h4"/><path d="M12 7v5"/><path d="M4 22h16a2 2 0 0 0 2-2V10L12 2 2 10v10a2 2 0 0 0 2 2z"/></svg>),
            UserPlus: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" x2="20" y1="8" y2="14"/><line x1="23" x2="17" y1="11" y2="11"/></svg>),
            Download: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a4 4 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>),
            Printer: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>),
            Users: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>),
            CircleCheck: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>),
            X: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 18 12"/></svg>),
            Calendar: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>),
            MinusCircle: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>),
            Trash2: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>),
            ChevronDown: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>),
            ArrowUp: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 15-6-6-6 6"/></svg>),
            ArrowDown: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>),
            Edit: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>),
            ListFilter: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>),
            Database: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>),
            EyeOff: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>),
            GenderMale: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="text-blue-500"><circle cx="10" cy="14" r="5"/><path d="M14 10l7-7"/><path d="M21 9V3h-6"/></svg>),
            GenderFemale: (props) => (<svg {...props} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="text-pink-500"><circle cx="12" cy="8" r="5"/><path d="M12 13v8"/><path d="M9 17h6"/></svg>)
        };

        const Icon = ({ name, size = 18, className }) => {
            const IconComponent = ICONS[name];
            return IconComponent ? <IconComponent width={size} height={size} className={className} /> : null;
        };

        const GradeSelector = ({ selectedGrades, onChange }) => {
            const [isOpen, setIsOpen] = useState(false);
            const dropdownRef = useRef(null);
            useEffect(() => {
                const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setIsOpen(false); };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);
            const grades = [{ val: "1", label: "小1" }, { val: "2", label: "小2" }, { val: "3", label: "小3" }, { val: "4", label: "小4" }, { val: "5", label: "小5" }, { val: "6", label: "小6" }];
            const toggleGrade = (val) => {
                let newGrades = selectedGrades.includes(val) ? selectedGrades.filter(g => g !== val) : [...selectedGrades, val].sort();
                onChange(newGrades);
            };
            const displayText = selectedGrades.length > 0 ? selectedGrades.map(g => `小${g}`).join(", ") : "選択";
            return (
                <div className="relative" ref={dropdownRef}>
                    <button className="border border-gray-300 rounded px-2 py-1 bg-white flex items-center gap-2 min-w-[80px] justify-between text-xs md:text-sm" onClick={() => setIsOpen(!isOpen)}>
                        <span className="truncate max-w-[100px] md:max-w-[120px]">{displayText}</span>
                        <Icon name="ChevronDown" size={14} className="text-gray-500" />
                    </button>
                    {isOpen && (
                        <div className="absolute top-full left-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg z-[70] w-40 p-2">
                            <div className="flex flex-col gap-1">
                                {grades.map((grade) => (
                                    <label key={grade.val} className="flex items-center gap-2 p-1.5 hover:bg-amber-50 rounded cursor-pointer">
                                        <input type="checkbox" checked={selectedGrades.includes(grade.val)} onChange={() => toggleGrade(grade.val)} className="accent-amber-500" />
                                        <span className="text-sm text-gray-700">{grade.label}</span>
                                    </label>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const today = new Date();
            const currentMonth = today.getMonth() + 1;
            const initialSemester = (currentMonth >= 4 && currentMonth <= 9) ? "first" : "second";
            const initialFiscalYear = (currentMonth >= 1 && currentMonth <= 3) ? today.getFullYear() - 1 : today.getFullYear();

            // --- URLパラメータを解析して初期フィルタを決定するロジック ---
            const initialFilters = useMemo(() => {
                const params = new URLSearchParams(window.location.search);
                const g = params.get('g'); // 1〜6
                const s = params.get('s'); // male or female
                return {
                    sort: 'manual',
                    filterGrades: g ? [g] : [],
                    filterBirthMonth: 'all',
                    filterGender: s || 'all',
                    showHidden: false
                };
            }, []);

            // --- State ---
            const [classInfo, setClassInfo] = useState({ fiscalYear: initialFiscalYear, semester: initialSemester, grade: [], gender: "", teacher: "", gradeTeachers: {} });
            const [students, setStudents] = useState([]);
            const [attendance, setAttendance] = useState({});
            const [bonusMonths, setBonusMonths] = useState({});
            
            // リストの表示設定 (初期値をURLパラメータから取得)
            const [viewConfig, setViewConfig] = useState(initialFilters);
            
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [isDeleteModalOpen, setIsDeleteModalOpen] = useState(false);
            const [isPrintModalOpen, setIsPrintModalOpen] = useState(false);
            const [isViewConfigModalOpen, setIsViewConfigModalOpen] = useState(false);
            const [isDataModalOpen, setIsDataModalOpen] = useState(false);
            const [isSummaryModalOpen, setIsSummaryModalOpen] = useState(false);
            const [summarySelectedDate, setSummarySelectedDate] = useState('');
            const [studentToDelete, setStudentToDelete] = useState(null);
            const [editingStudent, setEditingStudent] = useState(null);
            
            const [newStudentName, setNewStudentName] = useState("");
            const [newStudentGrade, setNewStudentGrade] = useState("");
            const [newStudentGender, setNewStudentGender] = useState(""); 
            const [newStudentBirthday, setNewStudentBirthday] = useState("");
            const [newStudentInitialPoints, setNewStudentInitialPoints] = useState(0);
            const [newStudentIsHidden, setNewStudentIsHidden] = useState(false);

            // ==========================================
            // Firestore 購読
            // ==========================================
            useEffect(() => {
                if (!isConfigured) return;

                const unsubClass = onSnapshot(doc(db, 'cs_settings', 'classInfo'), doc => {
                    if (doc.exists()) {
                        const data = doc.data();
                        if (typeof data.grade === 'string') data.grade = data.grade ? [data.grade] : [];
                        if (!data.gradeTeachers) data.gradeTeachers = {};
                        if (typeof data.teacher !== 'string') data.teacher = ""; // エラー防止対策
                        setClassInfo(prev => ({...prev, ...data}));
                    }
                });
                const unsubAttendance = onSnapshot(doc(db, 'cs_settings', 'attendance'), doc => { if (doc.exists()) setAttendance(doc.data()); });
                const unsubBonus = onSnapshot(doc(db, 'cs_settings', 'bonusMonths'), doc => { if (doc.exists()) setBonusMonths(doc.data()); });
                const unsubStudents = onSnapshot(collection(db, 'students'), snapshot => {
                    const list = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
                    list.sort((a, b) => (a.sortIndex || 0) - (b.sortIndex || 0));
                    setStudents(list);
                });
                return () => { unsubClass(); unsubAttendance(); unsubBonus(); unsubStudents(); };
            }, []);

            // --- Calculation & Logic ---
            const sundays = useMemo(() => {
                const dates = [];
                const year = parseInt(classInfo.fiscalYear);
                let startMonth = classInfo.semester === "first" ? 3 : 9;
                let current = new Date(year, startMonth, 1, 12, 0, 0);
                while (current.getDay() !== 0) current.setDate(current.getDate() + 1);
                const endDate = classInfo.semester === "first" ? new Date(year, 8, 30, 12, 0, 0) : new Date(year + 1, 2, 31, 12, 0, 0);
                while (current <= endDate) { dates.push(new Date(current)); current.setDate(current.getDate() + 7); }
                return dates;
            }, [classInfo.fiscalYear, classInfo.semester]);

            const sundaysByMonth = useMemo(() => {
                const groups = [];
                let currentGroup = null;
                sundays.forEach(date => {
                    const monthKey = `${date.getFullYear()}-${date.getMonth() + 1}`;
                    if (!currentGroup || currentGroup.key !== monthKey) {
                        if (currentGroup) groups.push(currentGroup);
                        currentGroup = { key: monthKey, month: date.getMonth() + 1, dates: [] };
                    }
                    currentGroup.dates.push(date);
                });
                if (currentGroup) groups.push(currentGroup);
                return groups;
            }, [sundays]);

            const formatDateKey = (date) => date.toISOString().split('T')[0];

            const calculateStats = (student) => {
                let presentCount = 0;
                let totalPoints = student.initialPoints || 0;
                sundays.forEach(date => {
                    const status = attendance[`${student.id}_${formatDateKey(date)}`];
                    if (status === 'present') {
                        presentCount++;
                        const isBonus = bonusMonths[`${date.getFullYear()}-${date.getMonth() + 1}`];
                        totalPoints += (isBonus ? 30 : 10);
                    }
                });
                return { presentCount, totalPoints, hkp: student.pointBalance !== undefined ? student.pointBalance : totalPoints };
            };

            const processedStudents = useMemo(() => {
                let list = students.map(s => ({ ...s, stats: calculateStats(s) }));
                
                if (!viewConfig.showHidden) list = list.filter(s => !s.isHidden);

                // 学年フィルタ (ヘッダーの選択を優先)
                if (classInfo.grade && classInfo.grade.length > 0) {
                    list = list.filter(s => classInfo.grade.includes(s.grade));
                } else if (viewConfig.filterGrades && viewConfig.filterGrades.length > 0) {
                    list = list.filter(s => viewConfig.filterGrades.includes(s.grade));
                }

                // 性別フィルタ (ヘッダーの選択)
                if (classInfo.gender) {
                    list = list.filter(s => s.gender === classInfo.gender);
                } else if (viewConfig.filterGender && viewConfig.filterGender !== 'all') {
                    list = list.filter(s => s.gender === viewConfig.filterGender);
                }

                // 担当者フィルタ (年度ごとにフィルタリング)
                // 学年が選択されていない場合のみ検索として機能させる（学年選択中は設定用とするため絞り込まない）
                if ((!classInfo.grade || classInfo.grade.length === 0) && typeof classInfo.teacher === 'string' && classInfo.teacher.trim() !== "") {
                    const searchText = classInfo.teacher.trim().toLowerCase();
                    const gTeachers = classInfo.gradeTeachers || {};
                    
                    // 【改善】検索文字列が一致する担当者の「学年」と「性別」の条件を抽出する
                    const matchedConditions = Object.keys(gTeachers)
                        .filter(k => k.startsWith(`${classInfo.fiscalYear}_`))
                        .filter(k => typeof gTeachers[k] === 'string' && gTeachers[k].toLowerCase().includes(searchText))
                        .map(k => {
                            const parts = k.split('_');
                            // parts[1] は学年、parts[2] は性別 (無ければ 'all')
                            return { grade: parts[1], gender: parts[2] || 'all' };
                        });
                        
                    // 抽出した条件 (学年＆性別) のいずれかに合致する生徒だけを残す
                    list = list.filter(s => {
                        return matchedConditions.some(cond => {
                            if (cond.grade !== s.grade) return false;
                            if (cond.gender !== 'all' && cond.gender !== s.gender) return false;
                            return true;
                        });
                    });
                }

                if (viewConfig.filterBirthMonth !== 'all') {
                    const target = parseInt(viewConfig.filterBirthMonth);
                    list = list.filter(s => s.birthday && (new Date(s.birthday).getMonth() + 1) === target);
                }
                
                if (viewConfig.sort === 'grade') list.sort((a, b) => (a.grade || "9").localeCompare(b.grade || "9"));
                else if (viewConfig.sort === 'points_desc') list.sort((a, b) => b.stats.hkp - a.stats.hkp);
                else if (viewConfig.sort === 'birthday') list.sort((a, b) => {
                    if (!a.birthday) return 1; if (!b.birthday) return -1;
                    const dA = new Date(a.birthday), dB = new Date(b.birthday);
                    return (dA.getMonth() + 1) * 100 + dA.getDate() - ((dB.getMonth() + 1) * 100 + dB.getDate());
                });
                
                return list;
            }, [students, attendance, bonusMonths, viewConfig, sundays, classInfo]);

            // --- Handlers ---
            const handleClassInfoChange = (key, value) => {
                const newInfo = { ...classInfo, [key]: value };
                const currentYear = newInfo.fiscalYear;
                
                // 【改善】学年だけでなく「性別」が切り替わった時も、該当する担当者を読み込み直す
                if (key === 'grade' || key === 'fiscalYear' || key === 'gender') {
                    const selectedGrades = newInfo.grade || [];
                    const currentGender = newInfo.gender || 'all'; // 現在選択中の性別 (未選択なら 'all')
                    
                    if (selectedGrades.length > 0) {
                        const gTeachers = newInfo.gradeTeachers || {};
                        const teachers = selectedGrades.map(g => {
                            // 新しいフォーマット (年度_学年_性別) を優先、なければ古いフォーマット (年度_学年) を取得
                            const newKey = `${currentYear}_${g}_${currentGender}`;
                            const oldKey = `${currentYear}_${g}`;
                            return gTeachers[newKey] !== undefined ? gTeachers[newKey] : gTeachers[oldKey];
                        }).filter(Boolean);
                        const uniqueTeachers = [...new Set(teachers)];
                        newInfo.teacher = uniqueTeachers.join(", ");
                    } else {
                        newInfo.teacher = "";
                    }
                }
                
                // 担当者を保存する処理
                if (key === 'teacher') {
                    const currentGender = newInfo.gender || 'all'; // 現在選択中の性別
                    if (newInfo.grade && newInfo.grade.length > 0) {
                        const newGradeTeachers = { ...(newInfo.gradeTeachers || {}) };
                        newInfo.grade.forEach(g => {
                            // 【改善】保存時のキーに性別も含める (例: "2024_5_male")
                            newGradeTeachers[`${currentYear}_${g}_${currentGender}`] = value;
                        });
                        newInfo.gradeTeachers = newGradeTeachers;
                    }
                }

                setClassInfo(newInfo);
                if (isConfigured) setDoc(doc(db, 'cs_settings', 'classInfo'), newInfo, { merge: true });
            };

            const toggleAttendance = async (studentId, dateKey) => {
                if (!isConfigured) return;
                const key = `${studentId}_${dateKey}`;
                const currentStatus = attendance[key];
                let nextStatus = currentStatus === 'present' ? 'absent' : (currentStatus === 'absent' ? 'holiday' : (currentStatus === 'holiday' ? null : 'present'));
                const d = new Date(dateKey);
                const points = bonusMonths[`${d.getFullYear()}-${d.getMonth() + 1}`] ? 30 : 10;
                let diff = (currentStatus !== 'present' && nextStatus === 'present') ? points : ((currentStatus === 'present' && nextStatus !== 'present') ? -points : 0);
                try {
                    const batch = writeBatch(db);
                    if (nextStatus === null) batch.update(doc(db, 'cs_settings', 'attendance'), { [key]: deleteField() });
                    else batch.update(doc(db, 'cs_settings', 'attendance'), { [key]: nextStatus });
                    if (diff !== 0) batch.update(doc(db, 'students', String(studentId)), { pointBalance: increment(diff) });
                    await batch.commit();
                    // GASへ出席データを送信（非同期・UIブロックなし）
                    if (nextStatus) {
                        const student = students.find(s => s.id === studentId);
                        if (student) sendToGoogleSheet(student, dateKey, nextStatus);
                    }
                } catch (e) { console.error(e); }
            };

            const toggleBonusMonth = async (monthKey) => {
                if (!isConfigured) return;
                const isNowBonus = !!bonusMonths[monthKey];
                const adjustment = isNowBonus ? -20 : 20; 
                const [y, m] = monthKey.split('-').map(Number);
                const monthSundays = sundays.filter(d => d.getFullYear() === y && d.getMonth() + 1 === m).map(formatDateKey);
                try {
                    const batch = writeBatch(db);
                    batch.set(doc(db, 'cs_settings', 'bonusMonths'), { [monthKey]: isNowBonus ? deleteField() : true }, { merge: true });
                    students.forEach(student => {
                        let count = 0; monthSundays.forEach(dk => { if (attendance[`${student.id}_${dk}`] === 'present') count++; });
                        if (count > 0) batch.update(doc(db, 'students', String(student.id)), { pointBalance: increment(count * adjustment) });
                    });
                    await batch.commit();
                } catch (e) { console.error(e); }
            };

            const updateStudentInitialPoints = async (id, v) => {
                if (!isConfigured) return;
                const newVal = parseInt(v) || 0, s = students.find(x => x.id === id);
                if (s) await updateDoc(doc(db, 'students', String(id)), { initialPoints: newVal, pointBalance: increment(newVal - (s.initialPoints || 0)) });
            };

            const handleSaveStudent = async (e) => {
                e.preventDefault();
                if (!newStudentName.trim()) return;
                try {
                    if (editingStudent) {
                        const oldInit = editingStudent.initialPoints || 0, newInit = parseInt(newStudentInitialPoints) || 0;
                        await updateDoc(doc(db, 'students', String(editingStudent.id)), { name: newStudentName, grade: newStudentGrade, gender: newStudentGender, birthday: newStudentBirthday, initialPoints: newInit, pointBalance: increment(newInit - oldInit), isHidden: newStudentIsHidden });
                    } else {
                        const ids = students.map(s => parseInt(s.id)).filter(id => !isNaN(id));
                        const newId = String((ids.length > 0 ? Math.max(...ids) : 0) + 1);
                        await setDoc(doc(db, 'students', newId), { name: newStudentName, grade: newStudentGrade, gender: newStudentGender, birthday: newStudentBirthday, initialPoints: parseInt(newStudentInitialPoints) || 0, pointBalance: parseInt(newStudentInitialPoints) || 0, memo: "", isHidden: newStudentIsHidden, sortIndex: students.length });
                    }
                    setIsAddModalOpen(false);
                } catch (e) { console.error(e); }
            };

            const openAddModal = () => { setEditingStudent(null); setNewStudentName(""); setNewStudentGrade(""); setNewStudentGender(""); setNewStudentBirthday(""); setNewStudentInitialPoints(0); setNewStudentIsHidden(false); setIsAddModalOpen(true); };
            const openEditModal = (s) => { setEditingStudent(s); setNewStudentName(s.name); setNewStudentGrade(s.grade || ""); setNewStudentGender(s.gender || ""); setNewStudentBirthday(s.birthday || ""); setNewStudentInitialPoints(s.initialPoints || 0); setNewStudentIsHidden(!!s.isHidden); setIsAddModalOpen(true); };
            const closeModal = () => setIsAddModalOpen(false);
            const executeDeleteStudent = async () => { if (studentToDelete) { await deleteDoc(doc(db, 'students', String(studentToDelete.id))); setIsDeleteModalOpen(false); } };
            const updateStudentMemo = (id, t) => { updateDoc(doc(db, 'students', String(id)), { memo: t }); };
            
            const moveStudent = async (idx, dir) => {
                const list = [...students];
                if (dir === 'up' && idx > 0) [list[idx], list[idx-1]] = [list[idx-1], list[idx]];
                else if (dir === 'down' && idx < list.length - 1) [list[idx], list[idx+1]] = [list[idx+1], list[idx]];
                const batch = writeBatch(db); list.forEach((s, i) => batch.update(doc(db, 'students', String(s.id)), { sortIndex: i })); await batch.commit();
            };

            const exportCSV = () => {
                let csv = "名前,会員ID,学年,メモ,初期HKP,累計P,出席数,HKP,欠席数," + sundays.map(d => `${d.getMonth()+1}/${d.getDate()}`).join(",") + "\n";
                students.forEach(s => {
                    const stats = calculateStats(s);
                    csv += `${s.name},${s.id},${s.grade ? '小'+s.grade : ""},${s.memo},${s.initialPoints},${stats.totalPoints},${stats.presentCount},${stats.hkp},0,` + sundays.map(d => {
                        const st = attendance[`${s.id}_${formatDateKey(d)}`];
                        return st === 'present' ? '出席' : (st === 'absent' ? '欠席' : (st === 'holiday' ? 'CS休み' : '-'));
                    }).join(",") + "\n";
                });
                const link = document.createElement("a");
                link.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
                link.download = `出席簿_${classInfo.fiscalYear}_${classInfo.semester === 'first' ? '上半期' : '下半期'}.csv`;
                link.click();
            };

            // --- 集計コピーモーダルを開く ---
            const openSummaryModal = () => {
                // デフォルトは最新（最後）の日曜日
                if (sundays.length > 0) {
                    setSummarySelectedDate(formatDateKey(sundays[sundays.length - 1]));
                }
                setIsSummaryModalOpen(true);
            };

            // --- 選択された日付の集計データをコピー（スプレッドシート貼り付け用 TSV） ---
            const copySummaryData = async () => {
                const sunday = sundays.find(d => formatDateKey(d) === summarySelectedDate);
                if (!sunday) return;

                const grades = ['1', '2', '3', '4', '5', '6'];
                const TAB = '\t';
                const dateKey = formatDateKey(sunday);
                const dateLabel = `${sunday.getMonth() + 1}/${sunday.getDate()}`;

                // 各学年×男女の出席人数を集計
                const counts = {};
                grades.forEach(g => {
                    counts[`${g}_male`] = 0;
                    counts[`${g}_female`] = 0;
                });

                students.forEach(s => {
                    if (!s.grade || !s.gender) return;
                    if (s.isHidden) return;
                    const status = attendance[`${s.id}_${dateKey}`];
                    if (status === 'present') {
                        const key = `${s.grade}_${s.gender}`;
                        if (counts[key] !== undefined) counts[key]++;
                    }
                });

                let tsv = '';
                // 日付ヘッダー行
                tsv += dateLabel + TAB + grades.map(g => `${g}年`).join(TAB) + TAB + '合計' + '\n';

                // 男の行
                let maleTotal = 0;
                const maleRow = grades.map(g => { const c = counts[`${g}_male`]; maleTotal += c; return c; });
                tsv += '男' + TAB + maleRow.join(TAB) + TAB + maleTotal + '\n';

                // 女の行
                let femaleTotal = 0;
                const femaleRow = grades.map(g => { const c = counts[`${g}_female`]; femaleTotal += c; return c; });
                tsv += '女' + TAB + femaleRow.join(TAB) + TAB + femaleTotal + '\n';

                // ゲーム行
                tsv += 'ゲーム' + TAB + TAB.repeat(grades.length) + (maleTotal + femaleTotal) + '\n';
                // 新来行
                tsv += '新来';

                // クリップボードにコピー
                try {
                    await navigator.clipboard.writeText(tsv);
                    alert(`${dateLabel} の集計データをコピーしました！\nスプレッドシートに貼り付け（Ctrl+V）してください。`);
                } catch (e) {
                    console.error('クリップボードコピー失敗:', e);
                    alert('コピーに失敗しました。ブラウザの権限設定を確認してください。');
                }
                setIsSummaryModalOpen(false);
            };

            const executePrint = (sem) => { handleClassInfoChange('semester', sem); setTimeout(() => window.print(), 500); setIsPrintModalOpen(false); };
            const getCellColor = (st) => st === 'present' ? 'bg-green-100 text-green-700 border-green-300' : (st === 'absent' ? 'bg-red-100 text-red-700 border-red-300' : (st === 'holiday' ? 'bg-gray-200 text-gray-500 border-gray-300' : 'bg-white border-gray-200'));
            const getStatusIcon = (st) => st === 'present' ? 'CircleCheck' : (st === 'absent' ? 'X' : (st === 'holiday' ? 'MinusCircle' : ''));

            return (
                <div className="flex flex-col h-full min-h-screen">
                    <header className="bg-white shadow-sm border-b border-amber-200 sticky top-0 z-[60] print:static">
                        <div className="max-w-full mx-auto px-4 py-2 md:py-3 flex flex-col md:flex-row items-center justify-between gap-3">
                            <div className="flex items-center gap-2">
                                <div className="p-1.5 md:p-2 bg-amber-100 rounded-lg text-amber-600"><Icon name="Church" /></div>
                                <h1 className="text-lg md:text-xl font-bold text-gray-800">教会学校 出席フォロー表</h1>
                            </div>
                            <div className="flex items-center gap-2 bg-gray-50 p-1 md:p-1.5 rounded-lg border border-gray-200">
                                <input type="number" value={classInfo.fiscalYear} onChange={(e) => handleClassInfoChange('fiscalYear', e.target.value)} className="w-16 md:w-20 p-1 text-center bg-white border border-gray-300 rounded-md focus:ring-amber-500 text-xs md:text-sm" />
                                <div className="flex bg-white rounded-md border border-gray-300 overflow-hidden">
                                    <button onClick={() => handleClassInfoChange('semester', 'first')} className={`px-2 py-1 md:px-3 text-xs md:text-sm ${classInfo.semester === 'first' ? 'bg-amber-100 text-amber-700 font-bold' : 'print:hidden'}`}>上半期</button>
                                    <button onClick={() => handleClassInfoChange('semester', 'second')} className={`px-2 py-1 md:px-3 text-xs md:text-sm ${classInfo.semester === 'second' ? 'bg-amber-100 text-amber-700 font-bold' : 'print:hidden'}`}>下半期</button>
                                </div>
                            </div>
                            <div className="flex gap-2 no-print">
                                <button onClick={openAddModal} className="flex items-center gap-1 bg-amber-500 hover:bg-amber-600 text-white px-2 py-1.5 rounded-lg font-medium shadow-sm text-xs md:text-sm"><Icon name="UserPlus" size={14} /><span>生徒追加</span></button>
                                <button onClick={() => setIsPrintModalOpen(true)} className="flex items-center gap-1 bg-blue-500 hover:bg-blue-600 text-white px-2 py-1.5 rounded-lg font-medium shadow-sm text-xs md:text-sm"><Icon name="Printer" size={14} /><span>印刷</span></button>
                                <button onClick={exportCSV} className="flex items-center gap-1 bg-white border border-gray-300 px-2 py-1.5 rounded-lg text-gray-700 text-xs md:text-sm"><Icon name="Download" size={14} /><span>出力</span></button>
                                <button onClick={openSummaryModal} className="flex items-center gap-1 bg-emerald-500 hover:bg-emerald-600 text-white px-2 py-1.5 rounded-lg font-medium shadow-sm text-xs md:text-sm"><Icon name="Database" size={14} /><span>集計コピー</span></button>
                                <button onClick={() => setIsViewConfigModalOpen(true)} className="bg-white border border-gray-300 p-2 rounded-lg"><Icon name="ListFilter" size={14} /></button>
                            </div>
                        </div>
                        <div className="px-4 py-2 bg-amber-50/50 flex flex-wrap gap-4 text-xs md:text-sm items-center border-t border-amber-100">
                            <div className="flex items-center gap-2"><span className="font-bold text-gray-600">学年:</span><GradeSelector selectedGrades={classInfo.grade} onChange={(gs) => handleClassInfoChange('grade', gs)} /></div>
                            <div className="flex items-center gap-2"><span className="font-bold text-gray-600">性別:</span>{['male','female'].map(g => <label key={g} className="flex items-center gap-1 cursor-pointer"><input type="radio" name="gen" checked={classInfo.gender === g} onChange={() => handleClassInfoChange('gender', g)} />{g === 'male' ? '男' : '女'}</label>)}</div>
                            <div className="flex items-center gap-2"><span className="font-bold text-gray-600 whitespace-nowrap">担当者:</span><input type="text" value={classInfo.teacher} onChange={(e) => handleClassInfoChange('teacher', e.target.value)} className="border border-gray-300 rounded px-2 py-1 bg-white w-32" /></div>
                        </div>
                    </header>

                    <main className="flex-grow overflow-hidden relative print-scale-wrapper">
                        <div className="absolute inset-0 overflow-auto">
                            <div className="min-w-max p-2 md:p-4">
                                <div className="bg-white rounded-xl shadow border border-gray-200 print-border">
                                    <table className="border-collapse text-left w-full">
                                        <thead className="sticky top-0 z-50">
                                            <tr className="bg-gray-100 text-gray-700 text-xs md:text-sm border-b border-gray-200">
                                                <th colSpan="4" className="p-1 border-r sticky left-0 z-50 bg-gray-100 print:static"></th>
                                                {sundaysByMonth.map(group => (
                                                    <th key={group.key} colSpan={group.dates.length} className="p-1 border-r text-center border-gray-300 bg-gray-100">
                                                        <div className="flex flex-col items-center py-1">
                                                            <span className="font-bold text-base">{group.month}月</span>
                                                            <label className={`no-print px-1.5 py-0.5 rounded cursor-pointer transition ${bonusMonths[group.key] ? 'bg-yellow-100 text-yellow-700 font-bold ring-1 ring-yellow-400' : 'bg-gray-200 text-gray-500 text-[10px]'}`}>
                                                                <input type="checkbox" checked={!!bonusMonths[group.key]} onChange={() => toggleBonusMonth(group.key)} className="hidden" />
                                                                <span>{bonusMonths[group.key] ? '★3倍月間' : '3倍月間'}</span>
                                                            </label>
                                                            {bonusMonths[group.key] && <span className="hidden print:inline text-[8pt] font-bold border border-black px-1 mt-1">3倍月間</span>}
                                                        </div>
                                                    </th>
                                                ))}
                                                <th colSpan="2" className="bg-gray-100"></th>
                                            </tr>
                                            <tr className="bg-gray-50 text-gray-600 text-[10px] md:text-xs border-b border-gray-200">
                                                <th className="p-2 w-10 md:w-12 sticky left-0 z-50 bg-gray-50 text-center border-r print:static">順</th>
                                                <th className="p-2 w-36 md:w-48 sticky left-10 md:left-12 z-50 bg-gray-50 border-r print:static text-center">名前 [会員ID]</th>
                                                <th className="p-2 w-12 md:w-16 text-center border-r sticky left-[11.5rem] md:left-[15rem] z-50 bg-gray-50 print:static">出席数</th>
                                                <th className="p-2 w-14 md:w-20 text-center border-r sticky left-[14.5rem] md:left-[19rem] z-50 bg-gray-50 print:static shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] print:shadow-none">HKP</th>
                                                {sundaysByMonth.map(g => g.dates.map((d, i) => (
                                                    <th key={d.toISOString()} className={`p-1 min-w-[28px] md:min-w-[36px] text-center font-medium ${i === 0 ? "border-l-2 border-l-gray-300" : "border-l border-gray-100"} ${bonusMonths[g.key] ? 'bg-yellow-50/50' : ''}`}>
                                                        <span className="text-xs font-bold text-amber-600">{d.getDate()}</span>
                                                    </th>
                                                )))}
                                                <th className="p-2 min-w-[100px] border-l bg-gray-50">メモ</th>
                                                <th className="p-2 w-8 no-print bg-gray-50"></th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-100">
                                            {processedStudents.map((student, idx) => {
                                                const stats = student.stats, originalIdx = students.findIndex(s => s.id === student.id);
                                                return (
                                                    <tr key={student.id} className={`hover:bg-gray-50 transition group ${student.isHidden ? 'bg-gray-100' : ''}`}>
                                                        <td className={`p-1 text-center text-gray-400 sticky left-0 z-20 border-r print:static ${student.isHidden ? 'bg-gray-100' : 'bg-white'}`}>
                                                            <div className="flex flex-col items-center gap-1 no-print">
                                                                {viewConfig.sort === 'manual' && <><button onClick={() => moveStudent(originalIdx, 'up')} disabled={originalIdx === 0} className="hover:text-amber-500 disabled:opacity-20"><Icon name="ArrowUp" size={12} /></button><span className="font-mono text-[10px]">{idx + 1}</span><button onClick={() => moveStudent(originalIdx, 'down')} disabled={originalIdx === students.length - 1} className="hover:text-amber-500 disabled:opacity-20"><Icon name="ArrowDown" size={12} /></button></>}
                                                            </div>
                                                            <span className="hidden print:block">{idx+1}</span>
                                                        </td>
                                                        <td className={`p-2 sticky left-10 md:left-12 z-20 border-r print:static ${student.isHidden ? 'bg-gray-100' : 'bg-white shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] print:shadow-none'}`}>
                                                            <div className="flex flex-col">
                                                                <div className="font-bold flex items-center gap-1 cursor-pointer hover:text-amber-600" onClick={() => openEditModal(student)}>
                                                                    <span className="truncate max-w-[80px] md:max-w-none text-xs md:text-sm">{student.name}</span>
                                                                    {student.gender === 'male' && <Icon name="GenderMale" size={10} />}
                                                                    {student.gender === 'female' && <Icon name="GenderFemale" size={10} />}
                                                                    <span className="text-[9px] font-mono text-slate-400 bg-slate-50 px-1 rounded">[{student.id}]</span>
                                                                    {student.grade && <span className="text-[10px] text-slate-500 bg-slate-100 px-1 rounded whitespace-nowrap">小{student.grade}</span>}
                                                                </div>
                                                                <div className="flex items-center gap-1 no-print text-[9px]">
                                                                    {student.birthday && <div className="text-gray-400 flex items-center gap-0.5"><Icon name="Calendar" size={9} />{student.birthday.substring(5).replace('-', '/')}</div>}
                                                                    <div className="text-gray-500 bg-gray-100 px-1 rounded ml-auto flex items-center gap-1">初期:<input type="number" step="10" defaultValue={student.initialPoints} onBlur={(e) => updateStudentInitialPoints(student.id, e.target.value)} className="w-8 bg-transparent text-right outline-none" /></div>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td className={`p-1 text-center font-medium text-gray-700 sticky left-[11.5rem] md:left-[15rem] z-20 border-r print:static ${student.isHidden ? 'bg-gray-100' : 'bg-white'}`}>{stats.presentCount}</td>
                                                        <td className={`p-1 text-center border-r sticky left-[14.5rem] md:left-[19rem] z-20 print:static shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] print:shadow-none ${student.isHidden ? 'bg-gray-100' : 'bg-amber-50 group-hover:bg-amber-100'}`}><div className="font-bold text-amber-700 text-sm md:text-base">{stats.hkp}</div></td>
                                                        {sundaysByMonth.map(g => g.dates.map(d => {
                                                            const dk = formatDateKey(d);
                                                            const st = attendance[`${student.id}_${dk}`];
                                                            const isBirth = isBirthdayNear(student.birthday, d);
                                                            return (
                                                                <td key={dk} className={`p-1 relative border-l border-gray-100 ${bonusMonths[g.key] && !student.isHidden ? 'bg-yellow-50/20' : ''}`}>
                                                                    {isBirth && !student.isHidden && <div className="absolute -top-1 -right-1 z-10 animate-bounce no-print">🎂</div>}
                                                                    <button onClick={() => toggleAttendance(student.id, dk)} disabled={student.isHidden} className={`w-full h-8 md:h-9 rounded-md flex items-center justify-center transition border ${getCellColor(st)} print:border-black print:h-7 ${student.isHidden ? 'opacity-30' : ''}`}>
                                                                        {st && <Icon name={getStatusIcon(st)} size={14} />}
                                                                    </button>
                                                                </td>
                                                            );
                                                        }))}
                                                        <td className="p-1 border-l"><input type="text" defaultValue={student.memo} onBlur={(e) => updateStudentMemo(student.id, e.target.value)} disabled={student.isHidden} className="w-full bg-transparent border-b border-transparent focus:border-amber-400 outline-none text-[10px] py-1" /></td>
                                                        <td className="p-1 text-center no-print"><button onClick={() => { setStudentToDelete(student); setIsDeleteModalOpen(true); }} className="text-gray-300 hover:text-red-500"><Icon name="Trash2" size={14} /></button></td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer className="bg-white border-t border-gray-200 p-2 md:p-3 print:static z-[60]">
                        <div className="max-w-full mx-auto flex flex-col md:flex-row items-center justify-between gap-2">
                            <div className="flex flex-wrap gap-3 text-[10px] md:text-xs text-gray-600 justify-center no-print">
                                <div className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-green-100 border border-green-300"></span> 出席(+10P)</div>
                                <div className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-red-100 border border-red-300"></span> 欠席</div>
                                <div className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-gray-200 border border-gray-300"></span> CS休み</div>
                                <div className="flex items-center gap-1 font-bold text-amber-600">★3倍月間は出席ごとに +30P</div>
                            </div>
                            <div className="text-gray-400 text-[10px] print:text-black print:ml-auto">東広島めぐみ教会 CS出席管理</div>
                        </div>
                    </footer>

                    {isAddModalOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4 animate-fadeIn no-print">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md">
                                <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><Icon name="UserPlus" className="text-amber-500" />{editingStudent ? "生徒編集" : "生徒登録"}</h2>
                                <form onSubmit={handleSaveStudent}>
                                    <div className="flex gap-4 mb-4">
                                        <div className="flex-[2]"><label className="block text-sm font-medium mb-1">お名前 *</label><input type="text" value={newStudentName} onChange={(e) => setNewStudentName(e.target.value)} className="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-amber-500" placeholder="例: 山田 太郎" autoFocus /></div>
                                        <div className="flex-1"><label className="block text-sm font-medium mb-1">学年</label><select value={newStudentGrade} onChange={(e) => setNewStudentGrade(e.target.value)} className="w-full p-2 border rounded-lg outline-none bg-white"><option value="">選択</option>{['1','2','3','4','5','6'].map(g => <option key={g} value={g}>小{g}</option>)}</select></div>
                                    </div>
                                    <div className="flex gap-4 mb-4">
                                        <div className="flex-1">
                                            <label className="block text-sm font-medium mb-1">性別</label>
                                            <div className="flex bg-gray-100 p-1 rounded-lg">
                                                {[{v:'',l:'なし'},{v:'male',l:'男'},{v:'female',l:'女'}].map(o => (
                                                    <button type="button" key={o.v} onClick={() => setNewStudentGender(o.v)} className={`flex-1 py-1.5 text-xs font-bold rounded-md transition ${newStudentGender === o.v ? 'bg-white shadow text-slate-800' : 'text-slate-400'}`}>{o.l}</button>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="flex-1"><label className="block text-sm font-medium mb-1">誕生日 (任意)</label><input type="date" value={newStudentBirthday} onChange={(e) => setNewStudentBirthday(e.target.value)} className="w-full p-2 border rounded-lg outline-none" /></div>
                                    </div>
                                    <div className="mb-6 w-24"><label className="block text-sm font-medium mb-1">初期HKP</label><input type="number" step="10" value={newStudentInitialPoints} onChange={(e) => setNewStudentInitialPoints(e.target.value)} className="w-full p-2 border rounded-lg outline-none text-right" /></div>
                                    {editingStudent && <div className="mb-6 p-2 bg-gray-50 rounded-lg"><label className="flex items-center gap-2 cursor-pointer text-sm"><input type="checkbox" checked={newStudentIsHidden} onChange={(e) => setNewStudentIsHidden(e.target.checked)} className="accent-amber-500" />リストに表示しない (非表示)</label></div>}
                                    <div className="flex justify-end gap-3"><button type="button" onClick={closeModal} className="px-4 py-2 text-gray-500">キャンセル</button><button type="submit" disabled={!newStudentName.trim()} className="px-6 py-2 bg-amber-500 text-white rounded-lg font-bold shadow hover:bg-amber-600">保存</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {isViewConfigModalOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4 no-print">
                            <div className="bg-white rounded-xl p-6 w-full max-w-sm shadow-2xl">
                                <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><Icon name="ListFilter" className="text-amber-500" /> 表示設定</h3>
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-sm font-bold mb-2">性別で絞り込む</label>
                                        <div className="flex bg-gray-100 p-1 rounded-xl">
                                            {[{v:'all',l:'すべて'},{v:'male',l:'男子のみ'},{v:'female',l:'女子のみ'}].map(o => (
                                                <button key={o.v} onClick={() => setViewConfig({...viewConfig, filterGender: o.v})} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${viewConfig.filterGender === o.v ? 'bg-white shadow text-slate-800' : 'text-slate-400 hover:text-slate-600'}`}>{o.l}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div><label className="block text-sm font-bold mb-2">並び替え</label><div className="grid gap-2">
                                        {[{ val: 'manual', label: '登録順' }, { val: 'grade', label: '学年順' }, { val: 'points_desc', label: 'HKP順' }, { val: 'birthday', label: '誕生日順' }].map(o => (
                                            <label key={o.val} className={`flex items-center gap-2 p-2 rounded-lg cursor-pointer border transition ${viewConfig.sort === o.val ? 'bg-amber-50 border-amber-300' : 'hover:bg-gray-50 border-gray-200'}`}><input type="radio" name="srt" checked={viewConfig.sort === o.val} onChange={() => setViewConfig({...viewConfig, sort: o.val})} className="accent-amber-500" /><span className="text-sm">{o.label}</span></label>
                                        ))}
                                    </div></div>
                                    <label className="flex items-center gap-2 p-2 border border-gray-200 rounded-lg"><input type="checkbox" checked={viewConfig.showHidden} onChange={(e) => setViewConfig({...viewConfig, showHidden: e.target.checked})} className="accent-amber-500" /><span className="text-sm">非表示設定の生徒も表示する</span></label>
                                </div>
                                <button onClick={() => setIsViewConfigModalOpen(false)} className="mt-6 w-full py-3 bg-amber-500 text-white rounded-xl font-bold">設定を閉じる</button>
                            </div>
                        </div>
                    )}

                    {isSummaryModalOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4 no-print animate-fadeIn">
                            <div className="bg-white rounded-xl p-6 w-full max-w-sm shadow-2xl">
                                <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><Icon name="Database" className="text-emerald-500" /> 集計データをコピー</h3>
                                <div className="mb-4">
                                    <label className="block text-sm font-bold mb-2">コピーする日付を選択</label>
                                    <select value={summarySelectedDate} onChange={(e) => setSummarySelectedDate(e.target.value)} className="w-full p-3 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                                        {[...sundays].reverse().map(d => (
                                            <option key={formatDateKey(d)} value={formatDateKey(d)}>{`${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`}</option>
                                        ))}
                                    </select>
                                </div>
                                <p className="text-xs text-gray-400 mb-6">選択した日付の学年×男女別の出席人数がコピーされます。スプレッドシートに直接貼り付け（Ctrl+V）できます。</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setIsSummaryModalOpen(false)} className="flex-1 py-2.5 bg-gray-100 rounded-lg text-gray-600 font-medium">キャンセル</button>
                                    <button onClick={copySummaryData} className="flex-1 py-2.5 bg-emerald-500 text-white rounded-lg font-bold shadow hover:bg-emerald-600">コピー</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isPrintModalOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4 no-print shadow-2xl"><div className="bg-white rounded-xl p-6 w-full max-w-sm text-center shadow-2xl"><h3 className="font-bold text-lg mb-6 flex items-center justify-center gap-2"><Icon name="Printer" /> 印刷期間を選択</h3><div className="grid gap-3"><button onClick={() => executePrint('first')} className="py-3 bg-amber-500 text-white rounded-lg font-bold shadow">上半期 (4-9月)</button><button onClick={() => executePrint('second')} className="py-3 bg-blue-500 text-white rounded-lg font-bold shadow">下半期 (10-3月)</button></div><button onClick={() => setIsPrintModalOpen(false)} className="mt-6 text-gray-400 underline text-xs">キャンセル</button></div></div>
                    )}

                    {isDeleteModalOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4 no-print"><div className="bg-white rounded-xl p-6 w-full max-w-sm text-center shadow-2xl"><div className="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="Trash2" /></div><h3 className="font-bold text-lg mb-2">生徒データを削除しますか？</h3><p className="text-sm text-gray-500 mb-6">「{studentToDelete?.name}」さんのデータは元に戻せません。</p><div className="flex gap-3"><button onClick={() => setIsDeleteModalOpen(false)} className="flex-1 py-2 bg-gray-100 rounded-lg">やめる</button><button onClick={executeDeleteStudent} className="flex-1 py-2 bg-red-500 text-white rounded-lg font-bold">削除実行</button></div></div></div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
