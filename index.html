                                    <label className="block text-sm font-bold text-gray-700 mb-2">絞り込み (フィルタ)</label>
                                    
                                    <div className="mb-3">
                                        <div className="text-xs text-gray-500 mb-1">学年:</div>
                                        <div className="flex flex-wrap gap-2">
                                            {['1','2','3','4','5','6'].map(g => (
                                                <label key={g} className={`px-3 py-1 rounded text-xs border cursor-pointer select-none transition ${viewConfig.filterGrades.includes(g) ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-white border-gray-200 text-gray-600'}`}>
                                                    <input 
                                                        type="checkbox" 
                                                        className="hidden"
                                                        checked={viewConfig.filterGrades.includes(g)}
                                                        onChange={() => {
                                                            const newGrades = viewConfig.filterGrades.includes(g) 
                                                                ? viewConfig.filterGrades.filter(val => val !== g)
                                                                : [...viewConfig.filterGrades, g];
                                                            setViewConfig({...viewConfig, filterGrades: newGrades});
                                                        }}
                                                    />
                                                    小{g}
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <div className="text-xs text-gray-500 mb-1">誕生月:</div>
                                        <select 
                                            value={viewConfig.filterBirthMonth} 
                                            onChange={(e) => setViewConfig({...viewConfig, filterBirthMonth: e.target.value})}
                                            className="w-full border border-gray-300 rounded p-1 text-sm bg-white"
                                        >
                                            <option value="all">すべて表示</option>
                                            {[...Array(12)].map((_, i) => (
                                                <option key={i+1} value={i+1}>{i+1}月生まれ</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                <div className="flex justify-end">
                                    <button 
                                        onClick={() => setIsViewConfigModalOpen(false)}
                                        className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-medium transition shadow-sm text-sm"
                                    >
                                        閉じる
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* モーダル類 (データ管理) */}
                    {isDataModalOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 animate-fadeIn no-print">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm text-center">
                                <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center justify-center gap-2">
                                    <Icon name="Database" className="text-amber-500" />
                                    データ管理 (保存・復元)
                                </h3>
                                
                                <div className="flex flex-col gap-4">
                                    <button 
                                        onClick={handleExportData}
                                        className="w-full py-4 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 rounded-lg shadow-sm transition flex flex-col items-center gap-2 group"
                                    >
                                        <Icon name="Save" size={24} className="text-amber-500 group-hover:scale-110 transition-transform" />
                                        <div className="flex flex-col">
                                            <span className="font-bold">ファイルに保存</span>
                                            <span className="text-xs text-gray-400">現在のデータをダウンロード</span>
                                        </div>
                                    </button>

                                    <div className="relative w-full">
                                        <input 
                                            type="file" 
                                            accept=".json"
                                            onChange={handleImportData}
                                            className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                                        />
                                        <div className="w-full py-4 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 rounded-lg shadow-sm transition flex flex-col items-center gap-2 group">
                                            <Icon name="Upload" size={24} className="text-blue-500 group-hover:scale-110 transition-transform" />
                                            <div className="flex flex-col">
                                                <span className="font-bold">ファイルから復元</span>
                                                <span className="text-xs text-gray-400">保存したデータを読み込み</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setIsDataModalOpen(false)}
                                    className="mt-6 text-gray-500 hover:text-gray-700 text-sm underline"
                                >
                                    閉じる
                                </button>
                            </div>
                        </div>
                    )}

                    {/* モーダル類 (削除) */}
                    {isDeleteModalOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 animate-fadeIn no-print">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm text-center">
                                <div className="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <Icon name="Trash2" size={24} />
                                </div>
                                <h3 className="text-lg font-bold text-gray-800 mb-2">削除しますか？</h3>
                                <p className="text-sm text-gray-600 mb-6">
                                    「{studentToDelete?.name}」さんのデータを削除します。<br/>
                                    この操作は元に戻せません。
                                </p>
                                <div className="flex justify-center gap-3">
                                    <button 
                                        onClick={() => setIsDeleteModalOpen(false)}
                                        className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition text-sm font-medium"
                                    >
                                        キャンセル
                                    </button>
                                    <button 
                                        onClick={executeDeleteStudent}
                                        className="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg font-medium transition shadow-sm text-sm"
                                    >
                                        削除実行
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
